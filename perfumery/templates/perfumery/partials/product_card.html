{% load humanize %}
<article class="product-card">
    <a class="product-card-link" href="{{ product.get_absolute_url }}">
        <div class="product-image">
            {% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">
            {% else %}<span class="product-fallback" aria-hidden="true">P.</span>{% endif %}
            {% if product.category %}<span class="product-category-badge">{{ product.category.name }}</span>{% endif %}
        </div>
        <div class="product-info">
            <div><p class="product-brand">{{ product.brand|default:'CHIZZY PERFUMERY' }}</p><h3 class="product-name">{{ product.name }}</h3><p class="product-volume">{{ product.volume_ml }}ml Eau de Parfum</p></div>
            <p class="product-price">₦{{ product.price|intcomma }}</p>
        </div>
    </a>
    <form class="quick-add" action="{% url 'perfumery:add_to_cart' product.id %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="btn quick-add-button" type="submit" {% if not product.stock %}disabled{% endif %}>
            {% if product.stock %}<i class="bi bi-bag-plus" aria-hidden="true"></i> Add to bag{% else %}Sold out{% endif %}
        </button>
    </form>
</article>
